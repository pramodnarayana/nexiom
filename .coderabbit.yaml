language: "en-US"
reviews:
  profile: assertive # Profile defaults to assertive, which is good for diagrams
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "Draft"
  tools:
    ast_grep:
      enabled: true
    linter:
      enabled: true
chat:
  auto_reply: true
