version: '3.8'

# Top-level variables — resolved by Compose at parse time from .env or the
# host shell, so x-common-env interpolation and service envs stay in sync.
x-db-vars: &db-vars
  POSTGRES_USER: ${POSTGRES_USER:-user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-nexiom_local}

x-windmill-env: &windmill-env
  DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/windmill
  BASE_URL: ${WINDMILL_BASE_URL:-http://localhost:8000}

x-common-env: &common-env
  DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nexiom_local}
  DATABASE_POOLED_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@pgbouncer:5432/${POSTGRES_DB:-nexiom_local}
  REDIS_URL: redis://redis:6379
  NODE_ENV: production

services:
  # --- Database ---
  postgres:
    image: postgres:15-alpine
    environment:
      <<: *db-vars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-windmill-db.sh:/docker-entrypoint-initdb.d/create-windmill-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-nexiom_local}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexiom-network

  # --- PgBouncer (transaction-mode connection pooler) ---
  # Accepts connections on Docker-internal port 5432 (exposed as host port 5433)
  # and pools them to postgres:5432.
  # DATABASE_POOLED_URL points here; use it for services that benefit from
  # connection pooling (e.g. high-concurrency workers).
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-nexiom_local}
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_PORT: 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- LocalStack (SQS + KMS) ---
  # SQS queues are auto-created on startup via the init script.
  # Endpoint: http://localhost:4566 — matches INFRA_MODE=local in QueueService / AwsKmsAdapter.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,kms
      DEBUG: "0"
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name inbound-queue --region us-east-1 && awslocal kms list-aliases --region us-east-1 | grep alias/nexiom-local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexiom-network

  # --- Prism (OpenAPI Mock Server) ---
  # Serves mock Salesforce / QuickBooks API responses for local dev.
  # Hit http://localhost:4010/services/data/v59.0/sobjects (Salesforce)
  # or http://localhost:4011/v3/company/... (QuickBooks) to test metadata discovery.
  prism-salesforce:
    image: stoplight/prism:4
    command: mock -h 0.0.0.0 /specs/openapi.json
    ports:
      - "4010:4010"
    volumes:
      - ./packages/pieces/salesforce/openapi.json:/specs/openapi.json:ro
    networks:
      - nexiom-network

  prism-quickbooks:
    image: stoplight/prism:4
    # Prism defaults to internal port 4010; -p 4010 is explicit for clarity.
    # Host port 4011 maps to container port 4010 — distinct from prism-salesforce.
    command: mock -h 0.0.0.0 -p 4010 /specs/openapi.json
    ports:
      - "4011:4010"
    volumes:
      - ./packages/pieces/quickbooks/openapi.json:/specs/openapi.json:ro
    networks:
      - nexiom-network

  # --- Cache/Queue ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexiom-network

  # --- Mailpit (Email Capture) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    networks:
      - nexiom-network

  # --- Backend ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
      # Overrides for Docker Networking
      # Windmill — docker networking overrides (secrets loaded from apps/api/.env via env_file)
      WINDMILL_BASE_URL: http://windmill_server:8000
      WINDMILL_WORKSPACE: nexiom
      WINDMILL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_MOCK: "false"
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      windmill_server:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Migrator (Ephemeral) ---
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: pnpm --filter api db:migrate
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- ID Studio (DB GUI) ---
  studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    # Bind to 0.0.0.0 so we can access it from the host
    # Use direct 'exec' via filter to find the binary in apps/api
    command: pnpm --filter api exec drizzle-kit studio --host 0.0.0.0 --port 4983
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
    ports:
      - "4983:4983"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Windmill (Scheduler) ---
  # windmill_init creates the schema on the 'windmill' database (one-shot, service_completed_successfully).
  # windmill_server is the stateless API + UI; windmill_worker executes stitch-runner scripts.
  # PID namespace isolation (ENABLE_UNSHARE_PID) prevents worker jobs from reading parent process
  # memory. Requires `privileged: true` on the worker container.
  windmill_init:
    image: ghcr.io/windmill-labs/windmill:v1.662.0
    pull_policy: always
    command: ["windmill", "init"]
    environment:
      <<: *windmill-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  windmill_server:
    image: ghcr.io/windmill-labs/windmill:v1.662.0
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *windmill-env
      MODE: server
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      windmill_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - nexiom-network

  windmill_worker:
    image: ghcr.io/windmill-labs/windmill:v1.662.0
    pull_policy: always
    restart: unless-stopped
    # privileged required for ENABLE_UNSHARE_PID
    privileged: true
    deploy:
      replicas: 2
    environment:
      <<: *windmill-env
      MODE: worker
      WORKER_GROUP: default
      ENABLE_UNSHARE_PID: "true"
    depends_on:
      windmill_server:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Frontend ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - nexiom-network

networks:
  nexiom-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  localstack_data:
