version: '3.8'

# Top-level variables — resolved by Compose at parse time from .env or the
# host shell, so x-common-env interpolation and service envs stay in sync.
x-db-vars: &db-vars
  POSTGRES_USER: ${POSTGRES_USER:-user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-platform_global}

x-windmill-env: &windmill-env
  DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/windmill
  BASE_URL: ${WINDMILL_BASE_URL:-http://localhost:8000}

x-common-env: &common-env
  DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-platform_global}
  DATABASE_POOLED_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@pgbouncer:5432/nexiom_global
  REDIS_URL: redis://redis:6379
  NODE_ENV: production

services:
  # --- Database ---
  postgres:
    image: postgres:15-alpine
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=5
        -c max_wal_senders=5
    environment:
      <<: *db-vars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-windmill-db.sh:/docker-entrypoint-initdb.d/01-create-windmill-db.sh:ro
      - ./scripts/init-postgres-cdc.sh:/docker-entrypoint-initdb.d/02-init-postgres-cdc.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexiom-network

  # --- PgBouncer (transaction-mode connection pooler) ---
  # Accepts connections on Docker-internal port 5432 (exposed as host port 5433)
  # and pools them to postgres:5432.
  # DATABASE_POOLED_URL points here; use it for all services.
  #
  # Config: infra/pgbouncer/pgbouncer.ini
  #   - nexiom_global: explicit mapping with pool_size=25
  #   - *: wildcard catch-all for dynamically provisioned tenant databases
  # Auth:   infra/pgbouncer/userlist.txt (md5 hashes)
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p0
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-user}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- LocalStack (SQS + KMS) ---
  # SQS queues are auto-created on startup via the init script.
  # Endpoint: http://localhost:4566 — matches INFRA_MODE=local in QueueService / AwsKmsAdapter.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,kms
      DEBUG: "0"
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name delivery-queue --region us-east-1 && awslocal kms list-aliases --region us-east-1 | grep alias/nexiom-local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexiom-network

  # --- Centralized Mock Gateway ---
  # Replaces individual Prism containers. Dynamically serves all OpenAPI mocks.
  # Hit http://localhost:4000/mock/salesforce/... or /mock/quickbooks/...
  mock_gateway:
    build:
      context: .
      dockerfile: apps/mock-gateway/Dockerfile
      target: runner
    ports:
      - "4000:4000"
    networks:
      - nexiom-network

  # --- Debezium CDC Relay ---
  debezium:
    image: quay.io/debezium/server:2.7.4.Final
    platform: linux/amd64
    env_file:
      - .env
    volumes:
      - ./infra/debezium/application.properties:/debezium/conf/application.properties:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
    networks:
      - nexiom-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/8080) >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Cache/Queue ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexiom-network

  # --- Mailpit (Email Capture) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    networks:
      - nexiom-network

  # --- Backend ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    profiles: ["app"]
    env_file:
      - .env
    environment:
      <<: *common-env
      # Overrides for Docker Networking
      # Windmill — docker networking overrides (secrets loaded from apps/api/.env via env_file)
      WINDMILL_BASE_URL: http://windmill_server:8000
      WINDMILL_WORKSPACE: nexiom
      WINDMILL_ENABLED: "true"
      WINDMILL_CALLBACK_URL: http://api:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_MOCK: "false"
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

    networks:
      - nexiom-network

  # --- Background Worker ---
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    profiles: ["app"]
    env_file:
      - .env
    restart: unless-stopped
    environment:
      <<: *common-env
      WINDMILL_BASE_URL: http://windmill_server:8000
      WINDMILL_WORKSPACE: nexiom
      WINDMILL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_MOCK: "false"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Migrator (Ephemeral) ---
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles: ["app"]
    command: pnpm --filter api db:migrate
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- ID Studio (DB GUI) ---
  studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles: ["app"]
    # Bind to 0.0.0.0 so we can access it from the host
    # Use direct 'exec' via filter to find the binary in apps/api
    command: pnpm --filter api exec drizzle-kit studio --host 0.0.0.0 --port 4983
    env_file:
      - .env
    environment:
      <<: *common-env
    ports:
      - "4983:4983"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Windmill (Scheduler) ---
  # Schema migrations are performed by windmill_server at startup or by a separate migration job.
  # windmill_server is the stateless API + UI; windmill_worker executes stitch-runner scripts.
  # PID namespace isolation (ENABLE_UNSHARE_PID) prevents worker jobs from reading parent process
  # memory. Requires `privileged: true` on the worker container.
  windmill_server:
    image: ghcr.io/windmill-labs/windmill:1.672.0
    profiles: ["disabled"]
    restart: unless-stopped
    environment:
      <<: *windmill-env
      MODE: server
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - nexiom-network

  windmill_worker:
    image: ghcr.io/windmill-labs/windmill:1.672.0
    profiles: ["disabled"]
    restart: unless-stopped
    # privileged required for ENABLE_UNSHARE_PID
    privileged: true
    deploy:
      replicas: 2
    environment:
      <<: *windmill-env
      MODE: worker
      WORKER_GROUP: default
      ENABLE_UNSHARE_PID: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexiom-network

  # --- Observability: Vector log-shipping sidecar ---
  # Reads JSON from the `api` container's stdout and ships to OpenObserve.
  # OPENOBSERVE_URL and OPENOBSERVE_TOKEN are required in production.
  vector:
    image: timberio/vector:0.43.0-alpine
    profiles: ["app"]
    restart: unless-stopped
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    environment:
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-nexiom}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-api-logs}
      OPENOBSERVE_TOKEN: ${OPENOBSERVE_TOKEN:-}
    depends_on:
      - api
    networks:
      - nexiom-network

  # --- Frontend ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - nexiom-network

networks:
  nexiom-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  vector_data: