version: '3.8'

x-common-env: &common-env
  DATABASE_URL: postgres://user:password@postgres:5432/nexiom_local
  DATABASE_POOLED_URL: postgres://user:password@pgbouncer:5432/nexiom_local
  REDIS_URL: redis://redis:6379
  NODE_ENV: production

services:
  # --- Database ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexiom_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d nexiom_local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexiom-network

  # --- PgBouncer (transaction-mode connection pooler) ---
  # Accepts connections on Docker-internal port 5432 (exposed as host port 5433)
  # and pools them to postgres:5432.
  # DATABASE_POOLED_URL points here; use it for services that benefit from
  # connection pooling (e.g. high-concurrency workers).
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: nexiom_local
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_PORT: 5432
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- LocalStack (SQS + KMS) ---
  # SQS queues are auto-created on startup via the init script.
  # Endpoint: http://localhost:4566 — matches INFRA_MODE=local in QueueService / AwsKmsAdapter.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,kms
      DEBUG: "0"
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues", "--region", "us-east-1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexiom-network

  # --- Cache/Queue ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexiom-network

  # --- Mailpit (Email Capture) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    networks:
      - nexiom-network

  # --- Backend ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
      # Overrides for Docker Networking
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_MOCK: "false"
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Migrator (Ephemeral) ---
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: pnpm --filter api db:migrate
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- ID Studio (DB GUI) ---
  studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    # Bind to 0.0.0.0 so we can access it from the host
    # Use direct 'exec' via filter to find the binary in apps/api
    command: pnpm --filter api exec drizzle-kit studio --host 0.0.0.0 --port 4983
    env_file:
      - apps/api/.env
    environment:
      <<: *common-env
    ports:
      - "4983:4983"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexiom-network

  # --- Frontend ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - nexiom-network

networks:
  nexiom-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  localstack_data:
