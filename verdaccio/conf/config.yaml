storage: /verdaccio/storage
plugins: /verdaccio/plugins
web:
  title: Local Verdaccio
auth:
  htpasswd:
    file: ./htpasswd
    max_users: -1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
logs: { type: stdout, format: pretty, level: http }
