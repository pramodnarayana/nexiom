;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Nexiom PgBouncer — Enterprise Connection Pooler Config
;;
;; Pool mode: TRANSACTION
;;   Compatible with Drizzle's SET LOCAL search_path pattern.
;;   NOT compatible with session-level SET, advisory locks, or
;;   LISTEN/NOTIFY — use direct Postgres connections for those.
;;
;; Auth: MD5
;;   See userlist.txt for credentials.
;;   For production: upgrade to scram-sha-256.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[databases]

;; Global registry database — explicit mapping with tuned pool settings
platform = host=postgres port=5432 dbname=platform pool_size=25 max_db_connections=50

;; Wildcard catch-all for dynamically provisioned tenant databases
;; Any database name not explicitly listed is forwarded to Postgres as-is.
;; Supports tenant DBs created at runtime without requiring PgBouncer restart.
* = host=postgres port=5432 pool_size=5

[pgbouncer]

;; Network
listen_addr = 0.0.0.0
listen_port = 5432

;; Auth
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256

;; Pooling
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 5

;; Connection lifetime management
;; Prevents "Connection terminated unexpectedly" on long-idle connections
server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 10
client_login_timeout = 10
query_wait_timeout = 30

;; Logging (minimal in production; set log_connections=1 for debugging)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;; Admin interface
;; Access: psql -h localhost -p 5433 -U pgbouncer pgbouncer
admin_users = pgbouncer
stats_users = pgbouncer
