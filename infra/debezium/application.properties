# ── Source: Postgres WAL ──────────────────────────────────────────────────────
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=nexiom
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRES_USER:-user}
debezium.source.database.password=${POSTGRES_PASSWORD:-password}
debezium.source.database.dbname=${POSTGRES_DB:-nexiom_local}
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=nexiom_cdc
debezium.source.slot.name=nexiom_slot

# Watch ONLY the outbox tables — not the heavy business payload tables
# Pattern: any schema, tables named inbound_outbox or replica_outbox
debezium.source.table.include.list=.*\\.inbound_outbox,.*\\.replica_outbox

# Never snapshot — outbox only captures new INSERTs going forward
debezium.source.snapshot.mode=never

# ── Sink: HTTP → NestJS CdcRelayController ───────────────────────────────────
debezium.sink.type=http
debezium.sink.http.url=http://api:3000/internal/cdc/relay
debezium.sink.http.timeout.ms=10000
debezium.sink.http.retry.count=10
debezium.sink.http.retry.delay.ms=500
debezium.sink.http.headers.Authorization=Bearer ${DEBEZIUM_SECRET}

# ── Transform: Unwrap envelope, emit only new row + table/schema metadata ────
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.drop.tombstones=true
debezium.transforms.unwrap.add.fields=table,schema,op

# ── Offset storage (local file for dev — no Kafka needed) ────────────────────
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000